<svg xmlns="http://www.w3.org/2000/svg"><style>
.s{animation:mv 8s linear infinite}
@keyframes mv{0%{transform:translateX(calc(44px + 0 * (100vw - 88px)))}50%{transform:translateX(calc(44px + 1 * (100vw - 88px)))}100%{transform:translateX(calc(44px + 0 * (100vw - 88px)))}}
svg:hover .s,.mv:focus-within,.mv:focus-within .s{animation-play-state:paused}
.c{fill:#fff;fill-opacity:.06;pointer-events:all;outline:none}
.c:focus{fill-opacity:.25;animation:gone 0s 3s forwards}
@keyframes gone{to{visibility:hidden}}
.coin{opacity:0;pointer-events:none}
.c:focus~.coin{opacity:1}
.body{pointer-events:none;transition:transform .5s}
.c1:focus~.body{transform:translateX(120px)}
</style>
<line x1="0" y1="72" x2="100%" y2="72" stroke="#888"/>
<g class="mv s">
<rect class="c c1" tabindex="0" x="100" y="0" width="60" height="76"/>
<circle class="coin" cx="130" cy="40" r="8" fill="gold"/>
<g class="body"><rect x="-15" y="20" width="30" height="50" rx="6" fill="#5ee7f0"/></g>
</g>
</svg>
